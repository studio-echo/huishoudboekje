<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Huishoudboekje</title>
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boekje">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="seg" id="persons" role="tablist" aria-label="Weergave"></div>
    <button class="icon" id="menu" aria-label="Instellingen">&#8943;</button>
  </header>
  <div class="bar" id="controls"></div>
  <main id="view" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<div id="lock" class="lock" hidden>
  <form id="lockform" class="card">
    <h1>Huishoudboekje</h1>
    <p class="muted">Geef het wachtwoord in.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord" aria-label="Wachtwoord">
    <p id="lockerr" class="err" role="alert"></p>
    <button class="primary" type="submit">Openen</button>
  </form>
</div>
<script src="config.js"></script>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
